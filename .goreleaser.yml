version: 2

builds:
  - main: ./cmd/probe
    binary: probe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format_overrides:
      - goos: darwin
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
