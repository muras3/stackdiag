name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Cross-compile release targets
        run: |
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${pair%/*} GOARCH=${pair#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/stackdiag
            echo "✓ ${pair}"
          done

      - name: Test (race detector)
        run: make test-race

      - name: E2E tests
        run: |
          set -o pipefail
          go test ./test/e2e/... -v -timeout 300s 2>&1 | tee /tmp/e2e.log

      - name: E2E test summary
        if: always()
        run: |
          echo "### E2E Test Results" >> $GITHUB_STEP_SUMMARY
          passed=$(grep -c "^--- PASS:" /tmp/e2e.log || true)
          failed=$(grep -c "^--- FAIL:" /tmp/e2e.log || true)
          skipped=$(grep -c "^--- SKIP:" /tmp/e2e.log || true)
          echo "- Passed: $passed" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $failed" >> $GITHUB_STEP_SUMMARY
          echo "- Skipped: $skipped" >> $GITHUB_STEP_SUMMARY

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Check binary size
        run: |
          size=$(stat --format=%s bin/stdiag)
          echo "Binary size: $((size / 1024 / 1024))MB (${size} bytes)"
          max=$((7 * 1024 * 1024))
          if [ "$size" -ge "$max" ]; then
            echo "::error::Binary size ${size} bytes exceeds 7MB limit"
            exit 1
          fi
