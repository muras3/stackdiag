server {
    listen 443 ssl;
    server_name nginx-chainbroken;

    # Serve only the leaf cert (missing intermediate CA).
    # Clients that don't have the intermediate in their trust store
    # will fail chain verification.
    ssl_certificate     /etc/nginx/certs/chainbroken.crt;
    ssl_certificate_key /etc/nginx/certs/chainbroken.key;

    location / {
        return 200 '{"status":"ok","service":"nginx-chainbroken"}';
        add_header Content-Type application/json;
    }
}
