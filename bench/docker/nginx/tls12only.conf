server {
    listen 443 ssl;
    server_name nginx-tls12;

    ssl_certificate     /etc/nginx/certs/valid.crt;
    ssl_certificate_key /etc/nginx/certs/valid.key;

    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;

    location / {
        return 200 '{"status":"ok","service":"nginx-tls12","tls":"1.2-only"}';
        add_header Content-Type application/json;
    }
}
