server {
    listen 443 ssl;
    server_name nginx-401;

    ssl_certificate     /etc/nginx/certs/valid.crt;
    ssl_certificate_key /etc/nginx/certs/valid.key;

    location / {
        add_header WWW-Authenticate 'Bearer realm="bench"' always;
        return 401 '{"status":"error","code":401}';
        add_header Content-Type application/json;
    }
}
