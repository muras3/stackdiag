server {
    listen 443 ssl;
    server_name nginx-429;

    ssl_certificate     /etc/nginx/certs/valid.crt;
    ssl_certificate_key /etc/nginx/certs/valid.key;

    location / {
        return 429 '{"status":"error","code":429}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }
}
